name: ROS2 CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ros2_ws/src/sharmech

      - name: Setup ROS2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install rosdep dependencies
        run: |
          cd ros2_ws
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build
        run: |
          cd ros2_ws
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release
        shell: bash

      - name: Test
        run: |
          cd ros2_ws
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_cohesion+
          colcon test-result --verbose
        shell: bash

      - name: Upload test & build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: colcon-logs
          path: ros2_ws/log/

  lint:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup ROS2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Run ament_lint
        run: |
          source /opt/ros/humble/setup.bash
          find . -name "*.cpp" -o -name "*.hpp" | xargs ament_cpplint || true
          find . -name "*.cpp" -o -name "*.hpp" | xargs ament_uncrustify --reformat || true
        shell: bash
