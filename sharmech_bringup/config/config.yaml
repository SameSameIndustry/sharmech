vr_interface_node:
  ros__parameters:
    workspace_x_min: -0.20   # 作業領域 X 下限 [m]
    workspace_x_max:  0.20   # 作業領域 X 上限 [m]
    workspace_y_min:  0.05   # 作業領域 Y 下限 [m]
    workspace_y_max:  0.30   # 作業領域 Y 上限 [m]

state_manager_node:
  ros__parameters:
    l1: 0.15           # 第1リンク長 [m]
    l2: 0.15           # 第2リンク長 [m]
    base_width: 0.10   # 2モータ間距離 [m]
    joint_tolerance: 0.05  # 到達判定閾値 [rad]

trajectory_generator_node:
  ros__parameters:
    num_waypoints: 50  # 補間点数
    v_max: 0.10        # 最大速度 [m/s]
    a_max: 0.20        # 最大加速度 [m/s^2]

kinematics_node:
  ros__parameters:
    l1: 0.15
    l2: 0.15
    base_width: 0.10

hardware_bridge_node:
  ros__parameters:
    control_rate: 100.0  # 制御周期 [Hz]
    # TODO: ハードウェア接続設定を追加
    # serial_port: /dev/ttyUSB0
    # baud_rate: 115200
