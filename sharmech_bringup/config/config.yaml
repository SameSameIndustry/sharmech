# sharmech ロボットパラメータ (一元管理)
# 各パラメータの意味は sharmech_core/docs/<node>.md を参照

motion_generator_node:
  ros__parameters:
    control_rate: 100.0      # Cartesianストリーム出力周期 [Hz]
    status_rate: 10.0        # /catchrobo/arm/status の配信周期 [Hz]
    v_max: 0.10              # 最大並進速度 [m/s]。軌道生成とジョグで共用
    a_max: 0.20              # 最大並進加速度 [m/s^2]。同上
    w_max: 1.0               # 最大角速度 (pitch/yaw) [rad/s]
    alpha_max: 2.0           # 最大角加速度 [rad/s^2]
    workspace_x_min: -0.20   # 作業領域 X 下限 [m]
    workspace_x_max:  0.20   # 作業領域 X 上限 [m]
    workspace_y_min:  0.05   # 作業領域 Y 下限 [m]
    workspace_y_max:  0.30   # 作業領域 Y 上限 [m]
    workspace_z_min:  0.00   # 作業領域 Z 下限 [m]
    workspace_z_max:  0.30   # 作業領域 Z 上限 [m]
    twist_timeout: 0.4       # ジョグのウォッチドッグ [s]
    goal_mode: "twist_priority"  # "twist_priority" / "exclusive"

joy_teleop_node:
  ros__parameters:
    publish_rate: 50.0       # Twist/グリッパの送信周期 [Hz]
    joy_timeout: 0.5         # /joy 途絶時に全入力をニュートラル扱いにする時間 [s]
    deadzone: 0.15           # スティックのデッドゾーン
    use_deadman: true        # デッドマンスイッチ (押している間だけジョグが効く)
    # home_pose: [0.0, 0.15, 0.15, 0.0, 0.0]  # [x, y, z, pitch, yaw]。機構確定後に設定
    # 軸・ボタン番号はドライバ依存。実機で `ros2 topic echo /joy` を見て合わせること
    vx_axis: 1               # 左スティック縦 → 前後
    vx_scale: 0.10
    vy_axis: 0               # 左スティック横 → 左右
    vy_scale: 0.10
    vz_axis: 7               # 十字キー縦 → 上下
    vz_scale: 0.10
    pitch_axis: 4            # 右スティック縦
    pitch_scale: 0.50
    yaw_axis: 3              # 右スティック横
    yaw_scale: 0.50
    deadman_button: 4        # L1
    gripper_toggle_button: 0 # ×
    home_button: 2           # △

hardware_bridge_node:
  ros__parameters:
    command_mode: "cartesian"   # "cartesian" (パターンA) / "joint" (パターンB・未実装)
    mcu_ip: "192.168.1.50"      # MCU の IP アドレス (有線 Ethernet)
    mcu_port: 8888              # MCU の UDP 受信ポート
    local_port: 8889            # フィードバック受信ポート
    feedback_poll_rate: 200.0   # 受信ポーリング周期 [Hz]
    feedback_timeout: 0.5       # フィードバック途絶の警告閾値 [s]
    # joint_names: []           # /joint_states の関節名。関節構成の確定待ち

kinematics_node:
  ros__parameters:
    # パターンB用。5軸パラレルリンク (肩2+ターンテーブル1+肘/膝2) の順運動学は
    # sharmech_core/include/sharmech_core/utility/parallel_arm_kinematics.hpp。
    # ロボット構成自体は2026-08-27にユーザー確認済みだが、以下の寸法はCAD/実測が
    # 無いため全て仮値 (0.0)。独断で数値を決め打ちしていない。実測のうえ上書きすること
    shoulder_pivot_half_separation_m: 0.0  # TODO: 要実測 (肩の2ピボット間距離の半分)
    shoulder_proximal_link_length_m: 0.0   # TODO: 要実測 (肩モータ側リンク長)
    shoulder_distal_link_length_m: 0.0     # TODO: 要実測 (肩EE側リンク長)
    knee_pivot_half_separation_m: 0.0      # TODO: 要実測 (肘/膝の2ピボット間距離の半分)
    knee_proximal_link_length_m: 0.0       # TODO: 要実測 (肘/膝モータ側リンク長)
    knee_distal_link_length_m: 0.0         # TODO: 要実測 (肘/膝EE側リンク長)
    turntable_axis_x_m: 0.0                # TODO: 要確認 (ターンテーブル軸のbase座標系x)
    turntable_axis_y_m: 0.0                # TODO: 要確認 (同上y)
    knee_base_height_m: 0.0                # TODO: 要確認 (肘/膝機構のd=0が対応するz)
