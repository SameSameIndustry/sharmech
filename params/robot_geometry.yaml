    date: 2026-09-11
    note: "★掴みに降りる (APPROACH_DESCEND) 先の絶対 z。game_state_manager_node が pick_request の z をこの値で常に上書きする (VR は缶の底面 z=0 を送ってくるため)。field_origin_offset.z_m が足される"

# -----------------------------------------------------------------------------
# 本番設置での原点ズレ補正 (現場合わせ)
# -----------------------------------------------------------------------------
# ロボット設置エリアの設計中心 (= field 原点) からの実際の設置誤差を吸収する。
# motion_generator_node (作業領域)・game_state_manager_node (スロット座標)・
# field_geometry の3箇所へ **同じ値** が生成される (以前は手で揃える必要があった)。
field_origin_offset:
  x_m:
    value: 0.0
    unit: m
    status: decision
    source: "既定 (ズレ無し)"
  y_m:
    value: 0.0
    unit: m
    status: decision
    source: "既定 (ズレ無し)"
  z_m:
    value: 0.0
    unit: m
    status: decision
    source: "既定 (ズレ無し)"
    note: "基準面 top_z_m の実測値はそのままに、全体を持ち上げ下げしたいときの逃げ道"

# -----------------------------------------------------------------------------
# 初期位置 (起動時と /catchrobo/game/reset で ROS2 が動かす先。2026-09-11〜 ROS2 側が正本)
# -----------------------------------------------------------------------------
# 座標は UDP で MCU に届くのと同じ極座標 (docs/mcu_spec.md §3.2/§5):
#   原点 = ターンテーブル軸 (kinematics.turntable_axis_x/y_m)、θ は +X から時計回り
#   (+X → −Y) が正 [rad]、z はベース座標系 [m]。
#   field_origin_offset は掛からない (ロボット自身に対する姿勢であって、フィールドの
#   設置誤差とは関係が無いため)。
# 赤・青で別々に持つ (初期位置の場所がフィールドの色で異なる。ユーザー要望)。
# game_state_manager_node が直交座標へ直し、直線 1 本のゴールでここへ動く
# (起動時・/catchrobo/game/reset・MCU フィードバック途絶からの復帰時)。
# 実行中は ros2 param set /game_state_manager_node init_pose_*。
# ★起動直後 (MCU 同期後) にここへ動くので、実機で最初に起動する前に必ず値を決めること
#   (決まるまで動かしたくなければ config.yaml の game_state_manager_node.init_on_startup: false)。
init_pose:
  r_red:
    value: 0.15
    unit: m
    status: estimate
    source: "実機で調整 (ユーザー指示、0.30 → 0.15)"
    date: 2026-09-12
    note: "ターンテーブル軸からの距離。起動直後にここへ動く"
  theta_red:
    value: 2.356194   # = 135 deg (3π/4)
    unit: rad
    status: estimate
    source: "実機で調整 (ユーザー指示 135°、0.0 → 2.356194 rad)"
    date: 2026-09-12
    note: "+X から時計回りが正 (0.0 = +X 方向)"
  z_red:
    value: 0.20
    unit: m
    status: estimate
    source: "実機で調整 (ユーザー指示、0.15 → 0.20)"
    date: 2026-09-12
  r_blue:
    value: 0.15
    unit: m
    status: estimate
    source: "赤と同じ (ユーザー指示、0.30 → 0.15)"
    date: 2026-09-12
  theta_blue:
    value: -2.356194   # = -135 deg (赤 +135° の鏡映)
    unit: rad
    status: estimate
    source: "実機で調整 (ユーザー指示 -135°、0.0 → -2.356194 rad)"
    date: 2026-09-12
  z_blue:
    value: 0.20
    unit: m
    status: estimate
    source: "赤と同じ (ユーザー指示、0.15 → 0.20)"
    date: 2026-09-12
